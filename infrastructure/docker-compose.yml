name: laundrie

services:
  postgres:
    image: postgres:16-alpine
    container_name: laundrie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laundrie
      POSTGRES_USER: laundrie
      POSTGRES_PASSWORD: laundrie_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundrie -d laundrie"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: laundrie-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: laundrie_test
      POSTGRES_USER: laundrie
      POSTGRES_PASSWORD: laundrie_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundrie -d laundrie_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: laundrie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MySQL dipertahankan untuk transisi, akan dihapus setelah Postgres stabil
  mysql:
    image: mysql:8.0
    container_name: laundrie-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: laundrie
      MYSQL_USER: laundrie
      MYSQL_PASSWORD: laundrie_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "laundrie", "-plaundrie_secret"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:
  mysql_data:
